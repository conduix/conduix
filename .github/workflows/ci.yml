name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

permissions:
  contents: read
  packages: write

jobs:
  # ============================================================
  # 1. Go 테스트 병렬화 (Matrix 전략)
  # 패키지별로 독립된 러너에서 동시 실행하여 시간을 1/5로 단축
  # ============================================================
  test-go:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [shared, plugin-sdk, pipeline-core, pipeline-worker, control-plane]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        id: setup-go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: "${{ matrix.package }}/go.sum"

      - name: Test ${{ matrix.package }}
        run: cd ${{ matrix.package }} && go test -v -p 4 -parallel 8 ./...

  # ============================================================
  # 2. Web UI 고속 빌드 (node_modules 직접 캐싱)
  # npm ci의 설치 시간(60s+)을 캐시 히트 시 0초로 만듦
  # ============================================================
  test-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        id: setup-node
        uses: actions/setup-node@v4
        with:
          # Vite 8 requires Node 20.19+/22.12+ (Node 18 fails: CustomEvent not defined)
          node-version: "22"

      - name: Cache node_modules
        id: cache-web
        uses: actions/cache@v4
        with:
          path: web-ui/node_modules
          # OS, Node 버전, lock 파일 해시를 조합한 정교한 키
          key: ${{ runner.os }}-node-${{ steps.setup-node.outputs.node-version }}-${{ hashFiles('web-ui/package-lock.json') }}
          # 일치하는 키가 없어도 가장 유사한 이전 캐시를 불러와서 델타 설치 유도
          restore-keys: |
            ${{ runner.os }}-node-${{ steps.setup-node.outputs.node-version }}-

      - name: Install dependencies
        # 캐시가 완벽히 일치하면 60~70초 걸리는 설치 과정을 통째로 건너뜀
        if: steps.cache-web.outputs.cache-hit != 'true'
        run: |
          cd web-ui
          npm ci --prefer-offline --no-audit

      - name: Build
        run: cd web-ui && npm run build

  # ============================================================
  # 3. Docker 이미지 빌드 (아키텍처별 병렬 빌드)
  # 서비스 × 아키텍처 = 6개 runner에서 동시 실행 → 빌드시간 증가 없음
  # ============================================================
  build:
    needs: [test-go, test-web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [control-plane, agent, web-ui]
        platform: [linux/amd64, linux/arm64]
        include:
          - service: control-plane
            dockerfile: deploy/docker/Dockerfile.control-plane
          - service: agent
            dockerfile: deploy/docker/Dockerfile.agent
          - service: web-ui
            dockerfile: deploy/docker/Dockerfile.web-ui
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Platform pair slug
        id: platform
        run: echo "slug=$(echo '${{ matrix.platform }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE_PREFIX }}/${{ matrix.service }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.service }}-${{ steps.platform.outputs.slug }}
          cache-to: type=gha,scope=${{ matrix.service }}-${{ steps.platform.outputs.slug }},mode=max

      - name: Export digest
        run: |
          mkdir -p /tmp/digests/${{ matrix.service }}
          digest='${{ steps.build.outputs.digest }}'
          touch "/tmp/digests/${{ matrix.service }}/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.service }}-${{ steps.platform.outputs.slug }}
          path: /tmp/digests/${{ matrix.service }}/*
          if-no-files-found: error
          retention-days: 1

  # ============================================================
  # 4. Manifest Merge + Tag Push
  # 아키텍처별 digest를 멀티 플랫폼 manifest로 합침
  # ============================================================
  merge-and-push:
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [control-plane, agent, web-ui]
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          pattern: digest-${{ matrix.service }}-*
          merge-multiple: true
          path: /tmp/digests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest
            type=raw,value=main

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< '${{ steps.meta.outputs.json }}') \
            $(printf '${{ env.IMAGE_PREFIX }}/${{ matrix.service }}@sha256:%s ' *)