name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

permissions:
  contents: read
  packages: write

jobs:
  # ============================================================
  # Go 테스트 (control-plane, pipeline-core, pipeline-agent, plugin-sdk)
  # ============================================================
  test-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: |
            shared/go.sum
            pipeline-core/go.sum
            pipeline-agent/go.sum
            control-plane/go.sum
            plugin-sdk/go.sum

      - name: Test shared
        run: cd shared && go test ./...

      - name: Test plugin-sdk
        run: cd plugin-sdk && go test ./...

      - name: Test pipeline-core
        run: cd pipeline-core && go test ./...

      - name: Test pipeline-agent
        run: cd pipeline-agent && go test ./...

      - name: Test control-plane
        run: cd control-plane && go test ./...

  # ============================================================
  # Web UI 테스트 + 빌드
  # ============================================================
  test-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: web-ui/package-lock.json

      - name: Install dependencies
        run: cd web-ui && npm ci

      - name: Type check
        run: cd web-ui && npx tsc --noEmit

      - name: Build
        run: cd web-ui && npm run build

  # ============================================================
  # Docker 이미지 빌드 + GHCR Push (main branch only)
  # ============================================================
  build-and-push:
    needs: [test-go, test-web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: control-plane
            dockerfile: deploy/docker/Dockerfile.control-plane
          - service: agent
            dockerfile: deploy/docker/Dockerfile.agent
          - service: web-ui
            dockerfile: deploy/docker/Dockerfile.web-ui
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
