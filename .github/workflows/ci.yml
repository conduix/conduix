name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

permissions:
  contents: read
  packages: write

jobs:
  # ============================================================
  # 1. Go 테스트 병렬화 (Matrix 전략)
  # 패키지별로 독립된 러너에서 동시 실행하여 시간을 1/5로 단축
  # ============================================================
  test-go:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [shared, plugin-sdk, pipeline-core, pipeline-worker, control-plane]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        id: setup-go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: "${{ matrix.package }}/go.sum"

      - name: Test ${{ matrix.package }}
        run: cd ${{ matrix.package }} && go test -v -p 4 -parallel 8 ./...

  # ============================================================
  # 1b. CDC 통합 테스트 (실 MySQL binlog + PostgreSQL logical)
  # build tag `cdcintegration` 로 분리된 테스트를 실제 DB 대상으로 실행.
  # services: 는 컨테이너에 command args(--log-bin, -c wal_level 등)를 못 넘기므로
  # step 에서 직접 docker run 한다(로컬 검증과 동일 구성 → 재현성).
  # 포트는 테스트 코드가 기대하는 13306/15432 에 맞춘다.
  # ============================================================
  test-cdc-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: "pipeline-core/go.sum"

      - name: Start MySQL (binlog + ROW + GTID)
        run: |
          docker run -d --name cdc-mysql \
            -e MYSQL_ROOT_PASSWORD=rootpw -e MYSQL_DATABASE=cdcdb \
            -p 13306:3306 mysql:8.0 \
            --log-bin=mysql-bin --binlog-format=ROW --server-id=1 \
            --gtid-mode=ON --enforce-gtid-consistency=ON

      - name: Start PostgreSQL (wal_level=logical)
        run: |
          docker run -d --name cdc-pg \
            -e POSTGRES_PASSWORD=pgpw -e POSTGRES_DB=cdcdb \
            -p 15432:5432 postgres:16 \
            -c wal_level=logical -c max_replication_slots=4 -c max_wal_senders=4

      - name: Wait for MySQL
        # mysqladmin ping 은 인증 실패여도 exit 0 → entrypoint 의 임시 서버(빈 패스워드)를
        # ready 로 오판한다. 임시 서버는 TCP 를 열지 않으므로(port=0) 127.0.0.1 경유
        # 인증 쿼리 성공을 실제 서버 기동의 판정 기준으로 삼는다.
        run: |
          ready=0
          for i in $(seq 1 60); do
            if docker exec cdc-mysql mysql -h127.0.0.1 -uroot -prootpw -N -e "SELECT 1" --silent 2>/dev/null; then
              echo "mysql ready"; ready=1; break
            fi
            sleep 2
          done
          if [ "$ready" != "1" ]; then echo "mysql not ready in 120s"; exit 1; fi
          docker exec cdc-mysql mysql -h127.0.0.1 -uroot -prootpw -N -e "SELECT @@log_bin, @@binlog_format, @@gtid_mode;"

      - name: Wait for PostgreSQL
        # entrypoint 초기화용 임시 서버는 unix socket 만 연다 → 127.0.0.1 로 체크해야
        # 임시 서버를 ready 로 오판하지 않는다 (MySQL 과 동일한 레이스).
        run: |
          ready=0
          for i in $(seq 1 60); do
            if docker exec cdc-pg pg_isready -h 127.0.0.1 -U postgres 2>/dev/null | grep -q "accepting"; then
              echo "pg ready"; ready=1; break
            fi
            sleep 2
          done
          if [ "$ready" != "1" ]; then echo "postgres not ready in 120s"; exit 1; fi
          docker exec -e PGPASSWORD=pgpw cdc-pg psql -h 127.0.0.1 -U postgres -d cdcdb -tAc "SHOW wal_level;"

      - name: Run CDC integration tests
        run: |
          cd pipeline-core
          go test -tags cdcintegration -count=1 -timeout 300s -v \
            ./pkg/source/ ./pkg/cdce2e/ \
            -run 'TestIntegration_MySQLCDC|TestIntegration_PostgresCDC'

      - name: Dump DB logs on failure
        if: failure()
        run: |
          echo "=== MySQL logs ==="; docker logs cdc-mysql 2>&1 | tail -50 || true
          echo "=== PostgreSQL logs ==="; docker logs cdc-pg 2>&1 | tail -50 || true

  # ============================================================
  # 2. Web UI 고속 빌드 (node_modules 직접 캐싱)
  # npm ci의 설치 시간(60s+)을 캐시 히트 시 0초로 만듦
  # ============================================================
  test-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        id: setup-node
        uses: actions/setup-node@v7
        with:
          # Vite 8 requires Node 20.19+/22.12+ (Node 18 fails: CustomEvent not defined)
          node-version: "22"
          # v5+ 는 npm 자동 캐싱(~/.npm)을 켠다 — 아래 node_modules 직접 캐싱과
          # 이중 캐시가 되므로 끈다
          package-manager-cache: false

      - name: Cache node_modules
        id: cache-web
        uses: actions/cache@v6
        with:
          path: web-ui/node_modules
          # OS, Node 버전, lock 파일 해시를 조합한 정교한 키
          key: ${{ runner.os }}-node-${{ steps.setup-node.outputs.node-version }}-${{ hashFiles('web-ui/package-lock.json') }}
          # 일치하는 키가 없어도 가장 유사한 이전 캐시를 불러와서 델타 설치 유도
          restore-keys: |
            ${{ runner.os }}-node-${{ steps.setup-node.outputs.node-version }}-

      - name: Install dependencies
        # 캐시가 완벽히 일치하면 60~70초 걸리는 설치 과정을 통째로 건너뜀
        if: steps.cache-web.outputs.cache-hit != 'true'
        run: |
          cd web-ui
          npm ci --prefer-offline --no-audit

      - name: Build
        run: cd web-ui && npm run build

  # ============================================================
  # 3. Docker 이미지 빌드 (아키텍처별 병렬 빌드)
  # 서비스 × 아키텍처 = 6개 runner에서 동시 실행 → 빌드시간 증가 없음
  # ============================================================
  build:
    needs: [test-go, test-cdc-integration, test-web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [control-plane, agent, web-ui, pipeline-batch-job]
        platform: [linux/amd64, linux/arm64]
        include:
          - service: control-plane
            dockerfile: deploy/docker/Dockerfile.control-plane
          - service: agent
            dockerfile: deploy/docker/Dockerfile.agent
          - service: web-ui
            dockerfile: deploy/docker/Dockerfile.web-ui
          - service: pipeline-batch-job
            dockerfile: pipeline-batch-job/Dockerfile
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Platform pair slug
        id: platform
        run: echo "slug=$(echo '${{ matrix.platform }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE_PREFIX }}/${{ matrix.service }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.service }}-${{ steps.platform.outputs.slug }}
          cache-to: type=gha,scope=${{ matrix.service }}-${{ steps.platform.outputs.slug }},mode=max

      - name: Export digest
        run: |
          mkdir -p /tmp/digests/${{ matrix.service }}
          digest='${{ steps.build.outputs.digest }}'
          touch "/tmp/digests/${{ matrix.service }}/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.service }}-${{ steps.platform.outputs.slug }}
          path: /tmp/digests/${{ matrix.service }}/*
          if-no-files-found: error
          retention-days: 1

  # ============================================================
  # 4. Manifest Merge + Tag Push
  # 아키텍처별 digest를 멀티 플랫폼 manifest로 합침
  # ============================================================
  merge-and-push:
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [control-plane, agent, web-ui, pipeline-batch-job]
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          pattern: digest-${{ matrix.service }}-*
          merge-multiple: true
          path: /tmp/digests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest
            type=raw,value=main

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< '${{ steps.meta.outputs.json }}') \
            $(printf '${{ env.IMAGE_PREFIX }}/${{ matrix.service }}@sha256:%s ' *)