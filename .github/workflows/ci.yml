name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

permissions:
  contents: read
  packages: write

jobs:
  # ============================================================
  # Go 테스트 (단일 job, 모듈 병렬 실행)
  # ============================================================
  test-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: "**/go.sum"
      - name: Test all Go modules
        run: |
          pids=()
          for mod in shared plugin-sdk pipeline-core pipeline-agent control-plane; do
            (cd "$mod" && go test -p 4 -parallel 8 ./...) &
            pids+=($!)
          done
          fail=0
          for pid in "${pids[@]}"; do
            wait "$pid" || fail=1
          done
          exit $fail

  # ============================================================
  # Web UI 빌드 (tsc는 build에 포함)
  # ============================================================
  test-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: web-ui/package-lock.json
      - run: cd web-ui && npm ci
      - run: cd web-ui && npm run build

  # ============================================================
  # Docker 이미지 빌드 + GHCR Push (main branch only)
  # ============================================================
  build-and-push:
    needs: [test-go, test-web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: control-plane
            dockerfile: deploy/docker/Dockerfile.control-plane
          - service: agent
            dockerfile: deploy/docker/Dockerfile.agent
          - service: web-ui
            dockerfile: deploy/docker/Dockerfile.web-ui
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
