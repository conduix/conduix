apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: conduix
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/conduix/conduix.git
    targetRevision: main
    path: deploy/helm/conduix
    helm:
      releaseName: conduix
      valueFiles:
        - values.yaml
      parameters:
        # ===========================================
        # 내장 MySQL/Redis 비활성화 (외부 DB 사용)
        # ===========================================
        - name: mysql.enabled
          value: "false"
        - name: redis.enabled
          value: "false"
        - name: migration.enabled
          value: "false"

        # ===========================================
        # 환경변수 (ConfigMap으로 주입)
        # ===========================================
        # Database (host.docker.internal for Docker Desktop)
        - name: env.DB_HOST
          value: "host.docker.internal"
        - name: env.DB_PORT
          value: "3307"
        - name: env.DB_USER
          value: "conduixuser"
        - name: env.DB_NAME
          value: "conduix"

        # Redis
        - name: env.REDIS_ADDR
          value: "host.docker.internal:6379"
        - name: env.REDIS_HOST
          value: "host.docker.internal"
        - name: env.REDIS_PORT
          value: "6379"

        # Application Settings
        - name: env.AUTO_MIGRATE
          value: "true"
        - name: env.FRONTEND_URL
          value: "http://localhost:30000"
        - name: env.MAX_DATATYPE_DEPTH
          value: "5"

        # Admin Users (comma-separated emails)
        - name: env.CONDUIX_ADMIN_EMAILS
          value: "herohyohwan@gmail.com,herohyohwan@users.noreply.github.com"

        # ===========================================
        # OAuth2 설정 (ConfigMap)
        # 실제 값은 로컬 배포 시 .env에서 주입
        # ===========================================
        # OAuth2 공통 Redirect URL
        - name: env.OAUTH_REDIRECT_URL
          value: "http://localhost:30080/api/v1/auth/callback"

        # OAuth2 Client IDs
        - name: env.GITHUB_CLIENT_ID
          value: "${GITHUB_CLIENT_ID}"
        - name: env.GOOGLE_CLIENT_ID
          value: "${GOOGLE_CLIENT_ID}"
        - name: env.NAVER_CLIENT_ID
          value: "${NAVER_CLIENT_ID}"

        # ===========================================
        # Image Tags
        # ===========================================
        - name: controlPlane.image.tag
          value: "main"
        - name: agent.image.tag
          value: "main"
        - name: webUI.image.tag
          value: "main"

        # ===========================================
        # Image Pull Policy (Always for local dev)
        # ===========================================
        - name: controlPlane.image.pullPolicy
          value: "Always"
        - name: agent.image.pullPolicy
          value: "Always"
        - name: webUI.image.pullPolicy
          value: "Always"

        # ===========================================
        # Service (NodePort for local access)
        # Control Plane: http://localhost:30080
        # Web UI: http://localhost:30000
        # Agent: http://localhost:30081
        # ===========================================
        - name: controlPlane.service.type
          value: "NodePort"
        - name: controlPlane.service.nodePort
          value: "30080"
        - name: webUI.service.type
          value: "NodePort"
        - name: webUI.service.nodePort
          value: "30000"
        - name: agent.service.type
          value: "NodePort"
        - name: agent.service.nodePort
          value: "30081"

        # ===========================================
        # Ingress (disabled for local)
        # ===========================================
        - name: ingress.enabled
          value: "false"

        # ===========================================
        # Secrets
        # 실제 값은 로컬 배포 시 .env에서 주입
        # ===========================================
        - name: secrets.dbPassword
          value: "${DB_PASSWORD}"
        - name: secrets.jwtSecret
          value: "${JWT_SECRET}"
        - name: secrets.GITHUB_CLIENT_SECRET
          value: "${GITHUB_CLIENT_SECRET}"
        - name: secrets.GOOGLE_CLIENT_SECRET
          value: "${GOOGLE_CLIENT_SECRET}"
        - name: secrets.NAVER_CLIENT_SECRET
          value: "${NAVER_CLIENT_SECRET}"

  destination:
    server: https://kubernetes.default.svc
    namespace: conduix

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
