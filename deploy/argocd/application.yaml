apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: conduix
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/conduix/conduix.git
    targetRevision: main
    path: deploy/helm/conduix
    helm:
      releaseName: conduix
      valueFiles:
        - values.yaml
      parameters:
        # ===========================================
        # 이미지 설정
        # ===========================================
        - name: global.imagePullSecrets[0].name
          value: ghcr-secret

        # ===========================================
        # 환경변수 (ConfigMap으로 주입)
        # ===========================================
        # Database
        # - name: env.DB_HOST
        #   value: "your-mysql-host"
        # - name: env.DB_PORT
        #   value: "3306"
        # - name: env.DB_USER
        #   value: "conduixuser"
        # - name: env.DB_NAME
        #   value: "conduix"

        # Redis
        # - name: env.REDIS_ADDR
        #   value: "your-redis-host:6379"

        # Application
        - name: env.AUTO_MIGRATE
          value: "true"
        - name: env.FRONTEND_URL
          value: "https://conduix.yourdomain.com"

        # OAuth2 (Client IDs)
        # - name: env.GITHUB_CLIENT_ID
        #   value: "your-client-id"
        # - name: env.GITHUB_REDIRECT_URL
        #   value: "https://conduix.yourdomain.com/api/v1/auth/callback"

        # ===========================================
        # Secrets (Secret으로 주입)
        # 프로덕션에서는 External Secrets 사용 권장
        # ===========================================
        # - name: secrets.jwtSecret
        #   value: "your-secure-jwt-secret"
        # - name: secrets.dbPassword
        #   value: "your-db-password"
        # - name: secrets.githubClientSecret
        #   value: "your-github-client-secret"

  destination:
    server: https://kubernetes.default.svc
    namespace: conduix

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
