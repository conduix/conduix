apiVersion: v2
name: conduix
description: Conduix - 데이터 파이프라인 관리 플랫폼
type: application
version: 1.0.0
appVersion: "1.0.0"

keywords:
  - data-pipeline
  - conduix
  - etl
  - streaming

home: https://github.com/conduix
sources:
  - https://github.com/conduix

maintainers:
  - name: Conduix Team
    email: team@example.com

dependencies:
  - name: mysql
    version: "12.x.x"
    repository: "oci://registry-1.docker.io/bitnamicharts"
    condition: mysql.enabled
  - name: redis
    version: "20.x.x"
    repository: "oci://registry-1.docker.io/bitnamicharts"
    condition: redis.enabled
  - name: kafka
    version: "31.x.x"
    repository: "oci://registry-1.docker.io/bitnamicharts"
    condition: kafka.enabled
