apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "conduix.fullname" . }}-agent
  labels:
    {{- include "conduix.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
spec:
  replicas: {{ .Values.agent.replicaCount }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "conduix.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: agent
  template:
    metadata:
      annotations:
        # ConfigMap 변경 시 자동 재시작
        checksum/config: {{ include (print $.Template.BasePath "/configmaps.yaml") . | sha256sum }}
      labels:
        {{- include "conduix.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: agent
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "conduix.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: agent
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.agent.image.repository }}:{{ .Values.agent.image.tag }}"
          imagePullPolicy: {{ .Values.agent.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
          env:
            - name: AGENT_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: CLUSTER_ID
              value: {{ .Values.agent.clusterId | default "default" | quote }}
            - name: CONTROL_PLANE_URL
              value: "http://{{ include "conduix.fullname" . }}-control-plane:{{ .Values.controlPlane.service.port }}"
            {{- if .Values.agent.runnerImage }}
            # 배치 워크플로우를 K8s Job 으로 위임할 때 쓰는 pipeline-batch-job 이미지.
            - name: RUNNER_IMAGE
              value: {{ .Values.agent.runnerImage | quote }}
            {{- end }}
            {{- if .Values.agent.preferredBackoffMs }}
            # 부하 분산 배정 시 선호 agent 우선권 백오프(ms). 환경 pub/sub 전달 지연보다 커야 편중 방지.
            - name: AGENT_PREFERRED_BACKOFF_MS
              value: {{ .Values.agent.preferredBackoffMs | quote }}
            {{- end }}
            {{- if .Values.agent.runnerEnvFromSecrets }}
            # batch Job/streaming pod 에 envFrom 으로 붙일 Secret 이름들(콤마 구분).
            # 파이프라인 config 의 ${VAR}(API 키·DB 비밀번호)를 실행 파드에서 해소하는 값 공급원.
            - name: RUNNER_ENV_FROM_SECRETS
              value: {{ join "," .Values.agent.runnerEnvFromSecrets | quote }}
            {{- end }}
            {{- if .Values.agent.runnerEnvFromConfigMaps }}
            - name: RUNNER_ENV_FROM_CONFIGMAPS
              value: {{ join "," .Values.agent.runnerEnvFromConfigMaps | quote }}
            {{- end }}
          envFrom:
            # ConfigMap에서 환경변수 주입
            - configMapRef:
                name: {{ include "conduix.fullname" . }}-agent-env
          volumeMounts:
            - name: config-volume
              mountPath: /etc/conduix/configs
            - name: data-volume
              mountPath: /var/lib/conduix
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.agent.resources | nindent 12 }}
      volumes:
        - name: config-volume
          configMap:
            name: {{ include "conduix.fullname" . }}-agent-config
        - name: data-volume
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
