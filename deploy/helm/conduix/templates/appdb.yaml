{{- if .Values.appdb.enabled }}
# ============================================================================
# conduix-appdb — control-plane 저장소 DB (영속).
# projects/workflows/plugins 등 운영 데이터를 담는다. mock 소스/타깃(mock-mysql,
# 비영속)과 분리 — 재배포/재시작에도 데이터가 살아남아야 한다(PVC).
# ============================================================================
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "conduix.fullname" . }}-appdb
  labels:
    {{- include "conduix.labels" . | nindent 4 }}
    app.kubernetes.io/component: appdb
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with .Values.appdb.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.appdb.storage | default "2Gi" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "conduix.fullname" . }}-appdb-init
  labels:
    {{- include "conduix.labels" . | nindent 4 }}
    app.kubernetes.io/component: appdb
data:
  init.sql: |
    -- control-plane 저장소 DB. 스키마는 AutoMigrate 가 만든다 — 여기선 DB 만 보장.
    CREATE DATABASE IF NOT EXISTS conduix CHARACTER SET utf8mb4;
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "conduix.fullname" . }}-appdb
  labels:
    {{- include "conduix.labels" . | nindent 4 }}
    app.kubernetes.io/component: appdb
spec:
  replicas: 1
  # PVC(RWO)를 놓고 도는 pod 라 롤링 시 두 pod 가 볼륨을 다투지 않도록 Recreate.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "conduix.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: appdb
  template:
    metadata:
      labels:
        {{- include "conduix.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: appdb
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: {{ .Values.appdb.rootPassword | quote }}
          ports:
            - containerPort: 3306
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            - name: init
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h127.0.0.1 -uroot -p{{ .Values.appdb.rootPassword }}"]
            initialDelaySeconds: 20
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "conduix.fullname" . }}-appdb
        - name: init
          configMap:
            name: {{ include "conduix.fullname" . }}-appdb-init
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "conduix.fullname" . }}-appdb
  labels:
    {{- include "conduix.labels" . | nindent 4 }}
    app.kubernetes.io/component: appdb
spec:
  selector:
    {{- include "conduix.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: appdb
  ports:
    - port: 3306
      targetPort: 3306
{{- end }}
