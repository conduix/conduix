---
# Control Plane 환경변수 ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "conduix.fullname" . }}-control-plane-env
  labels:
    {{- include "conduix.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
data:
  # Database (MySQL Operator로 별도 배포)
  DB_HOST: "{{ .Values.env.DB_HOST }}"
  DB_PORT: "{{ .Values.env.DB_PORT }}"
  DB_USER: "{{ .Values.env.DB_USER }}"
  DB_NAME: "{{ .Values.env.DB_NAME }}"

  # Redis (Bitnami subchart)
  {{- if .Values.redis.enabled }}
  REDIS_ADDR: "{{ .Release.Name }}-redis-master:6379"
  {{- else }}
  REDIS_ADDR: "{{ .Values.env.REDIS_ADDR }}"
  {{- end }}

  # Kafka (Strimzi Operator로 별도 배포)
  {{- if .Values.env.KAFKA_BROKERS }}
  KAFKA_BROKERS: "{{ .Values.env.KAFKA_BROKERS }}"
  {{- end }}

  # Application Settings
  AUTO_MIGRATE: "{{ .Values.env.AUTO_MIGRATE }}"
  MAX_DATATYPE_DEPTH: "{{ .Values.env.MAX_DATATYPE_DEPTH }}"
  {{- if .Values.env.USERS_CONFIG_PATH }}
  USERS_CONFIG_PATH: "{{ .Values.env.USERS_CONFIG_PATH }}"
  {{- end }}
  FRONTEND_URL: "{{ .Values.env.FRONTEND_URL }}"

  # Admin Users (comma-separated emails)
  {{- if .Values.env.CONDUIX_ADMIN_EMAILS }}
  CONDUIX_ADMIN_EMAILS: "{{ .Values.env.CONDUIX_ADMIN_EMAILS }}"
  {{- end }}
  {{- if .Values.env.CONDUIX_OPERATOR_EMAILS }}
  CONDUIX_OPERATOR_EMAILS: "{{ .Values.env.CONDUIX_OPERATOR_EMAILS }}"
  {{- end }}

  # OAuth2 Settings
  {{- if .Values.env.OAUTH_REDIRECT_URL }}
  OAUTH_REDIRECT_URL: "{{ .Values.env.OAUTH_REDIRECT_URL }}"
  {{- end }}

  # Mock 데이터 소스 DNS (로컬 E2E 전용) — seed.go 가 SEED_* env 로 읽어 샘플 파이프라인에 주입.
  # DNS 는 릴리스명에서 파생하므로 values 에 하드코딩하지 않는다.
  {{- if .Values.mocks.enabled }}
  {{- $mockRest := printf "%s-mock-rest" (include "conduix.fullname" .) }}
  {{- $mockMysql := printf "%s-mock-mysql" (include "conduix.fullname" .) }}
  SEED_MOCK_REST_URL: "http://{{ $mockRest }}:8080"
  SEED_MOCK_SOURCE_DSN: "root:rootpassword@tcp({{ $mockMysql }}:3306)/sourcedb"
  SEED_MOCK_TARGET_DSN: "root:rootpassword@tcp({{ $mockMysql }}:3306)/targetdb"
  SEED_MOCK_CDC_HOST: "{{ $mockMysql }}"
  {{- if .Values.mocks.kafka.enabled }}
  SEED_MOCK_KAFKA_BROKER: "{{ include "conduix.fullname" . }}-mock-kafka:9092"
  {{- end }}
  {{- end }}

  # OAuth2 Client IDs (non-sensitive)
  {{- if .Values.env.GITHUB_CLIENT_ID }}
  GITHUB_CLIENT_ID: "{{ .Values.env.GITHUB_CLIENT_ID }}"
  {{- end }}
  {{- if .Values.env.GOOGLE_CLIENT_ID }}
  GOOGLE_CLIENT_ID: "{{ .Values.env.GOOGLE_CLIENT_ID }}"
  {{- end }}
  {{- if .Values.env.NAVER_CLIENT_ID }}
  NAVER_CLIENT_ID: "{{ .Values.env.NAVER_CLIENT_ID }}"
  {{- end }}
  {{- if .Values.env.KAKAO_CLIENT_ID }}
  KAKAO_CLIENT_ID: "{{ .Values.env.KAKAO_CLIENT_ID }}"
  {{- end }}

---
# Agent 환경변수 ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "conduix.fullname" . }}-agent-env
  labels:
    {{- include "conduix.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
data:
  # Redis
  {{- if .Values.redis.enabled }}
  REDIS_HOST: "{{ .Release.Name }}-redis-master"
  REDIS_PORT: "6379"
  {{- else }}
  REDIS_HOST: "{{ .Values.env.REDIS_HOST | default (regexReplaceAll ":.*" .Values.env.REDIS_ADDR "") }}"
  REDIS_PORT: "{{ .Values.env.REDIS_PORT | default "6379" }}"
  {{- end }}

  HEARTBEAT_INTERVAL: "{{ .Values.agent.env.HEARTBEAT_INTERVAL | default "10s" }}"
  CONFIG_DIR: "/etc/conduix/configs"

---
# Agent Config ConfigMap (파이프라인 설정)
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "conduix.fullname" . }}-agent-config
  labels:
    {{- include "conduix.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
data:
  # 샘플 파이프라인 설정 - 필요에 따라 수정
  sample-pipeline.yaml: |
    version: "1.0"
    name: "sample-pipeline"
    type: flat

    sources:
      demo_logs:
        type: demo
        interval: 1s
        format: "apache_common"

    transforms:
      parse:
        type: remap
        inputs: ["demo_logs"]
        source: |
          . = parse_common_log!(.message)

    sinks:
      console:
        type: console
        inputs: ["parse"]
        encoding: json

---
# Nginx ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "conduix.fullname" . }}-nginx-config
  labels:
    {{- include "conduix.labels" . | nindent 4 }}
    app.kubernetes.io/component: web-ui
data:
  nginx.conf: |
    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;
        charset utf-8;

        # Gzip 압축
        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
        gzip_min_length 1000;

        # API 프록시
        location /api/ {
            proxy_pass http://{{ include "conduix.fullname" . }}-control-plane:{{ .Values.controlPlane.service.port }}/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket 지원 (실시간 업데이트용)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # 타임아웃 설정
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # OAuth 콜백 프록시
        location /auth/ {
            proxy_pass http://{{ include "conduix.fullname" . }}-control-plane:{{ .Values.controlPlane.service.port }}/auth/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 헬스체크
        location /health {
            access_log off;
            return 200 "OK";
            add_header Content-Type text/plain;
        }

        # SPA 라우팅 - 모든 경로를 index.html로
        location / {
            try_files $uri $uri/ /index.html;
        }

        # 정적 파일 캐싱
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
