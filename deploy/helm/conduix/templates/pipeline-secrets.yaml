{{- if .Values.pipelineSecrets }}
---
# Pipeline Secrets — batch Job/streaming pod 에 envFrom 으로 주입되어
# 파이프라인 config 의 ${VAR}(API 키·외부 DB 비밀번호 등)를 실행 파드에서 해소한다.
# agent.runnerEnvFromSecrets 에 이 Secret 이름을 넣어야 Job 에 붙는다.
# CP/agent 인프라 secret(-control-plane-secrets)과 분리 — 관심사가 다르다.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "conduix.fullname" . }}-pipeline-secrets
  labels:
    {{- include "conduix.labels" . | nindent 4 }}
    app.kubernetes.io/component: pipeline-runtime
type: Opaque
stringData:
  {{- range $k, $v := .Values.pipelineSecrets }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
