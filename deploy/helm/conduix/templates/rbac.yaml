{{- if .Values.rbac.create -}}
# 위임 구조(docs/EXECUTION_TOPOLOGY_INTENT.md): K8s Job을 만드는 주체는
# 각 cluster의 pipeline-worker다. control-plane은 K8s를 직접 만지지 않으므로
# 이 권한은 worker에만 필요하다. worker는 자기 네임스페이스에만 Job을 만들면 되므로
# ClusterRole이 아니라 네임스페이스 한정 Role을 쓴다(최소 권한).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "conduix.fullname" . }}-worker-job-manager
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "conduix.labels" . | nindent 4 }}
rules:
  # worker가 자기 cluster에 배치 실행 Job(pipeline-batch-job)을 생성/조회/삭제
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  # Job Pod 상태·로그 조회 (배치 실행 관측)
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "conduix.fullname" . }}-worker-job-manager
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "conduix.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "conduix.fullname" . }}-worker-job-manager
subjects:
  - kind: ServiceAccount
    name: {{ include "conduix.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
