{{- if .Values.secrets.create }}
---
# Control Plane Secrets (민감한 환경변수)
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "conduix.fullname" . }}-control-plane-secrets
  labels:
    {{- include "conduix.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
type: Opaque
stringData:
  # JWT Secret
  {{- if .Values.secrets.jwtSecret }}
  JWT_SECRET: "{{ .Values.secrets.jwtSecret }}"
  {{- else }}
  JWT_SECRET: "{{ randAlphaNum 32 }}"
  {{- end }}

  # Database Password (MySQL Operator로 별도 배포)
  DB_PASSWORD: "{{ .Values.secrets.dbPassword }}"

  # Redis Password
  {{- if and .Values.redis.enabled .Values.redis.auth.enabled }}
  REDIS_PASSWORD: "{{ .Values.redis.auth.password }}"
  {{- else if .Values.secrets.redisPassword }}
  REDIS_PASSWORD: "{{ .Values.secrets.redisPassword }}"
  {{- end }}

  # OAuth2 Client Secrets
  {{- if .Values.secrets.githubClientSecret }}
  GITHUB_CLIENT_SECRET: "{{ .Values.secrets.githubClientSecret }}"
  {{- end }}
  {{- if .Values.secrets.googleClientSecret }}
  GOOGLE_CLIENT_SECRET: "{{ .Values.secrets.googleClientSecret }}"
  {{- end }}
  {{- if .Values.secrets.naverClientSecret }}
  NAVER_CLIENT_SECRET: "{{ .Values.secrets.naverClientSecret }}"
  {{- end }}
  {{- if .Values.secrets.kakaoClientSecret }}
  KAKAO_CLIENT_SECRET: "{{ .Values.secrets.kakaoClientSecret }}"
  {{- end }}

---
# Legacy secrets (호환성용)
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "conduix.fullname" . }}-secrets
  labels:
    {{- include "conduix.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.secrets.jwtSecret }}
  jwt-secret: {{ .Values.secrets.jwtSecret | b64enc | quote }}
  {{- else }}
  jwt-secret: {{ randAlphaNum 32 | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.githubClientSecret }}
  github-client-secret: {{ .Values.secrets.githubClientSecret | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.googleClientSecret }}
  google-client-secret: {{ .Values.secrets.googleClientSecret | b64enc | quote }}
  {{- end }}
{{- end }}
