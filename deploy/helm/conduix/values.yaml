# Global settings
global:
  imageRegistry: ""
  imagePullSecrets: []

# =============================================================================
# 환경변수 설정 (ConfigMap으로 주입)
# ArgoCD에서 env.* 파라미터로 오버라이드 가능
# =============================================================================
env:
  # Database (mysql.enabled=false 일 때 사용)
  DB_HOST: "host.docker.internal"
  DB_PORT: "3307"
  DB_USER: "conduixuser"
  DB_NAME: "conduix"

  # Redis (redis.enabled=false 일 때 사용)
  REDIS_ADDR: "host.docker.internal:6379"
  REDIS_HOST: "host.docker.internal"
  REDIS_PORT: "6379"

  # Application Settings
  AUTO_MIGRATE: "true"
  MAX_DATATYPE_DEPTH: "10"
  USERS_CONFIG_PATH: "config/users.yaml"
  FRONTEND_URL: "http://localhost:3000"

  # OAuth2 Client IDs (non-sensitive)
  GITHUB_CLIENT_ID: ""
  GITHUB_REDIRECT_URL: ""
  GOOGLE_CLIENT_ID: ""
  GOOGLE_REDIRECT_URL: ""
  NAVER_CLIENT_ID: ""
  NAVER_REDIRECT_URL: ""
  KAKAO_CLIENT_ID: ""
  KAKAO_REDIRECT_URL: ""

# =============================================================================
# Secrets (민감한 정보, Secret으로 주입)
# ArgoCD에서 secrets.* 파라미터로 오버라이드 가능
# 프로덕션에서는 External Secrets 또는 Sealed Secrets 사용 권장
# =============================================================================
secrets:
  create: true
  # JWT Secret (미설정 시 자동 생성)
  jwtSecret: ""
  # Database Password
  dbPassword: "conduixpassword"
  # Redis Password
  redisPassword: ""
  # OAuth2 Client Secrets
  githubClientSecret: ""
  googleClientSecret: ""
  naverClientSecret: ""
  kakaoClientSecret: ""

# =============================================================================
# Control Plane
# =============================================================================
controlPlane:
  replicaCount: 2
  image:
    repository: ghcr.io/conduix/control-plane
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80
  # Legacy OAuth2 설정 (deprecated, env.* 사용 권장)
  oauth2:
    github:
      enabled: false
      clientId: ""
      clientSecret: ""
      redirectUrl: ""
    google:
      enabled: false
      clientId: ""
      clientSecret: ""
      redirectUrl: ""

# DB 마이그레이션 (초기 설치 시 테이블 생성)
migration:
  enabled: true

# =============================================================================
# Pipeline Agent
# =============================================================================
agent:
  replicaCount: 3
  image:
    repository: ghcr.io/conduix/agent
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8081
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 200m
      memory: 256Mi
  env:
    HEARTBEAT_INTERVAL: "10s"
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 20
    targetCPUUtilizationPercentage: 70

# =============================================================================
# Web UI
# =============================================================================
webUI:
  replicaCount: 2
  image:
    repository: ghcr.io/conduix/web-ui
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi

# =============================================================================
# Ingress
# =============================================================================
ingress:
  enabled: true
  className: nginx
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
  hosts:
    - host: conduix.local
      paths:
        - path: /
          pathType: Prefix
          service: web-ui
        - path: /api
          pathType: Prefix
          service: control-plane
  tls: []

# =============================================================================
# MySQL (Bitnami subchart)
# enabled: false 일 때 env.DB_* 설정 사용
# =============================================================================
mysql:
  enabled: true
  auth:
    rootPassword: "rootpassword"
    database: "conduix"
    username: "conduixuser"
    password: "conduixpassword"
  primary:
    persistence:
      enabled: true
      size: 10Gi

# =============================================================================
# Redis (Bitnami subchart)
# enabled: false 일 때 env.REDIS_* 설정 사용
# =============================================================================
redis:
  enabled: true
  architecture: standalone
  auth:
    enabled: false
  master:
    persistence:
      enabled: true
      size: 5Gi

# =============================================================================
# ServiceAccount & Security
# =============================================================================
serviceAccount:
  create: true
  annotations: {}
  name: ""

podSecurityContext:
  fsGroup: 1000

securityContext:
  runAsNonRoot: true
  runAsUser: 1000

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity
affinity: {}
