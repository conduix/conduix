# Global settings
global:
  # Bitnami 이미지는 이제 docker.io가 아닌 registry.docker.io에서 제공
  # 빈 값으로 두면 각 subchart의 기본 registry 사용
  imageRegistry: ""
  imagePullSecrets: []

# Bitnami subchart 이미지 설정 (Docker Hub에서 더 이상 제공 안함)
# registry-1.docker.io/bitnami/* 형식으로 pull됨

# =============================================================================
# 환경변수 설정 (ConfigMap으로 주입)
# ArgoCD에서 env.* 파라미터로 오버라이드 가능
# =============================================================================
env:
  # Database (mysql.enabled=false 일 때 사용)
  DB_HOST: "host.docker.internal"
  DB_PORT: "3307"
  DB_USER: "conduixuser"
  DB_NAME: "conduix"

  # Redis (redis.enabled=false 일 때 사용)
  REDIS_ADDR: "host.docker.internal:6379"
  REDIS_HOST: "host.docker.internal"
  REDIS_PORT: "6379"

  # Kafka (kafka.enabled=false 일 때 사용)
  KAFKA_BROKERS: "host.docker.internal:9092"

  # Application Settings
  AUTO_MIGRATE: "true"
  MAX_DATATYPE_DEPTH: "10"
  USERS_CONFIG_PATH: ""
  FRONTEND_URL: "http://localhost:3000"

  # Admin Users (comma-separated emails)
  CONDUIX_ADMIN_EMAILS: ""
  CONDUIX_OPERATOR_EMAILS: ""

  # OAuth2 Client IDs (non-sensitive)
  GITHUB_CLIENT_ID: ""
  GITHUB_REDIRECT_URL: ""
  GOOGLE_CLIENT_ID: ""
  GOOGLE_REDIRECT_URL: ""
  NAVER_CLIENT_ID: ""
  NAVER_REDIRECT_URL: ""
  KAKAO_CLIENT_ID: ""
  KAKAO_REDIRECT_URL: ""

# =============================================================================
# Secrets (민감한 정보, Secret으로 주입)
# ArgoCD에서 secrets.* 파라미터로 오버라이드 가능
# 프로덕션에서는 External Secrets 또는 Sealed Secrets 사용 권장
# =============================================================================
secrets:
  create: true
  # JWT Secret (미설정 시 자동 생성)
  jwtSecret: ""
  # Database Password
  dbPassword: "conduixpassword"
  # Redis Password
  redisPassword: ""
  # OAuth2 Client Secrets
  githubClientSecret: ""
  googleClientSecret: ""
  naverClientSecret: ""
  kakaoClientSecret: ""

# =============================================================================
# Control Plane
# =============================================================================
controlPlane:
  replicaCount: 2
  image:
    repository: ghcr.io/conduix/control-plane
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80
  # Legacy OAuth2 설정 (deprecated, env.* 사용 권장)
  oauth2:
    github:
      enabled: false
      clientId: ""
      clientSecret: ""
      redirectUrl: ""
    google:
      enabled: false
      clientId: ""
      clientSecret: ""
      redirectUrl: ""

# DB 마이그레이션 (초기 설치 시 테이블 생성)
migration:
  enabled: true

# =============================================================================
# Pipeline Agent
# =============================================================================
agent:
  replicaCount: 3
  image:
    repository: ghcr.io/conduix/agent
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8081
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 200m
      memory: 256Mi
  env:
    HEARTBEAT_INTERVAL: "10s"
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 20
    targetCPUUtilizationPercentage: 70

# =============================================================================
# Web UI
# =============================================================================
webUI:
  replicaCount: 2
  image:
    repository: ghcr.io/conduix/web-ui
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi

# =============================================================================
# Ingress
# =============================================================================
ingress:
  enabled: true
  className: nginx
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
  hosts:
    - host: conduix.local
      paths:
        - path: /
          pathType: Prefix
          service: web-ui
        - path: /api
          pathType: Prefix
          service: control-plane
  tls: []

# =============================================================================
# MySQL (Bitnami subchart)
# enabled: false 일 때 env.DB_* 설정 사용
# =============================================================================
mysql:
  enabled: true
  auth:
    rootPassword: "rootpassword"
    database: "conduix"
    username: "conduixuser"
    password: "conduixpassword"
  primary:
    persistence:
      enabled: true
      size: 10Gi

# =============================================================================
# Redis (Bitnami subchart)
# enabled: false 일 때 env.REDIS_* 설정 사용
# =============================================================================
redis:
  enabled: true
  architecture: standalone
  auth:
    enabled: false
  master:
    persistence:
      enabled: true
      size: 5Gi

# =============================================================================
# Kafka (Bitnami subchart v26.x - KRaft 모드)
# 파이프라인 간 데이터 전달용
# enabled: false 일 때 env.KAFKA_BROKERS 설정 사용
# =============================================================================
kafka:
  enabled: false  # 기본값은 false (선택적 배포)
  # KRaft 모드 (Zookeeper 없이 동작, Kafka 3.x+)
  kraft:
    enabled: true
  zookeeper:
    enabled: false
  # Controller 노드 (KRaft 모드에서는 controller가 broker 역할도 수행)
  controller:
    replicaCount: 1
    persistence:
      enabled: true
      size: 10Gi
  # 별도 Broker 노드 (로컬에서는 0으로 설정, controller가 역할 수행)
  broker:
    replicaCount: 0
  # 리소스 설정
  resources:
    limits:
      cpu: 1000m
      memory: 2Gi
    requests:
      cpu: 250m
      memory: 512Mi
  # Kafka 설정
  extraConfig: |
    auto.create.topics.enable=true
    delete.topic.enable=true
    log.retention.hours=168
    log.segment.bytes=1073741824
    log.retention.check.interval.ms=300000
    num.partitions=3
    default.replication.factor=1
    offsets.topic.replication.factor=1
    transaction.state.log.replication.factor=1
    transaction.state.log.min.isr=1

# =============================================================================
# ServiceAccount & Security
# =============================================================================
serviceAccount:
  create: true
  annotations: {}
  name: ""

# RBAC for Kubernetes Log Source
# Grants cluster-wide pod/log read access to the agent
rbac:
  create: true

podSecurityContext:
  fsGroup: 1000

securityContext:
  runAsNonRoot: true
  runAsUser: 1000

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity
affinity: {}
