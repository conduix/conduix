# Global settings
global:
  # Bitnami 이미지는 이제 docker.io가 아닌 registry.docker.io에서 제공
  # 빈 값으로 두면 각 subchart의 기본 registry 사용
  imageRegistry: ""
  imagePullSecrets: []

# Bitnami subchart 이미지 설정 (Docker Hub에서 더 이상 제공 안함)
# registry-1.docker.io/bitnami/* 형식으로 pull됨

# =============================================================================
# 환경변수 설정 (ConfigMap으로 주입)
# ArgoCD에서 env.* 파라미터로 오버라이드 가능
# =============================================================================
env:
  # Database (MySQL Operator InnoDBCluster 서비스)
  DB_HOST: "mysql-cluster"
  DB_PORT: "3306"
  DB_USER: "root"
  DB_NAME: "conduix"

  # Redis (Bitnami subchart 서비스)
  REDIS_ADDR: "conduix-redis-master:6379"
  REDIS_HOST: "conduix-redis-master"
  REDIS_PORT: "6379"

  # Kafka (Strimzi Kafka 서비스)
  KAFKA_BROKERS: "conduix-kafka-kafka-bootstrap:9092"

  # Application Settings
  AUTO_MIGRATE: "true"
  MAX_DATATYPE_DEPTH: "10"
  USERS_CONFIG_PATH: ""
  FRONTEND_URL: "http://localhost:3000"

  # Admin Users (comma-separated emails)
  CONDUIX_ADMIN_EMAILS: ""
  CONDUIX_OPERATOR_EMAILS: ""

  # OAuth2 Settings
  OAUTH_REDIRECT_URL: ""  # 공통 OAuth Redirect URL (예: http://localhost:30080/api/v1/auth/callback)

  # OAuth2 Client IDs (non-sensitive)
  GITHUB_CLIENT_ID: ""
  GOOGLE_CLIENT_ID: ""
  NAVER_CLIENT_ID: ""
  KAKAO_CLIENT_ID: ""

# =============================================================================
# Secrets (민감한 정보, Secret으로 주입)
# ArgoCD에서 secrets.* 파라미터로 오버라이드 가능
# 프로덕션에서는 External Secrets 또는 Sealed Secrets 사용 권장
# =============================================================================
secrets:
  create: true
  # JWT Secret (미설정 시 자동 생성)
  jwtSecret: ""
  # Database Password (MySQL Operator에서 설정한 패스워드와 일치해야 함)
  dbPassword: "rootpassword"
  # Redis Password
  redisPassword: ""
  # OAuth2 Client Secrets
  GITHUB_CLIENT_SECRET: ""
  GOOGLE_CLIENT_SECRET: ""
  NAVER_CLIENT_SECRET: ""
  KAKAO_CLIENT_SECRET: ""

# =============================================================================
# Control Plane
# =============================================================================
controlPlane:
  replicaCount: 2
  image:
    repository: ghcr.io/conduix/control-plane
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80
  # Legacy OAuth2 설정 (deprecated, env.* 사용 권장)
  oauth2:
    github:
      enabled: false
      clientId: ""
      clientSecret: ""
      redirectUrl: ""
    google:
      enabled: false
      clientId: ""
      clientSecret: ""
      redirectUrl: ""

# DB 마이그레이션 (초기 설치 시 테이블 생성)
migration:
  enabled: true

# =============================================================================
# Pipeline Agent
# =============================================================================
agent:
  replicaCount: 3
  image:
    repository: ghcr.io/conduix/agent
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8081
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 200m
      memory: 256Mi
  env:
    HEARTBEAT_INTERVAL: "10s"
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 20
    targetCPUUtilizationPercentage: 70

# =============================================================================
# Web UI
# =============================================================================
webUI:
  replicaCount: 2
  image:
    repository: ghcr.io/conduix/web-ui
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi

# =============================================================================
# Ingress
# =============================================================================
ingress:
  enabled: true
  className: nginx
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
  hosts:
    - host: conduix.local
      paths:
        - path: /
          pathType: Prefix
          service: web-ui
        - path: /api
          pathType: Prefix
          service: control-plane
  tls: []

# =============================================================================
# Redis (Bitnami subchart)
# enabled: false 일 때 env.REDIS_* 설정 사용
# =============================================================================
redis:
  enabled: true
  image:
    tag: latest
  architecture: standalone
  auth:
    enabled: false
  master:
    persistence:
      enabled: true
      size: 5Gi

# =============================================================================
# MySQL: MySQL Operator로 별도 배포 (mysql-cluster ArgoCD Application)
# Kafka: Strimzi Operator로 별도 배포 (kafka-cluster CRD)
# 아래 설정은 외부 서비스 연결용
# =============================================================================

# =============================================================================
# ServiceAccount & Security
# =============================================================================
serviceAccount:
  create: true
  annotations: {}
  name: ""

# RBAC for Kubernetes Log Source
# Grants cluster-wide pod/log read access to the agent
rbac:
  create: true

podSecurityContext:
  fsGroup: 1000

securityContext:
  runAsNonRoot: true
  runAsUser: 1000

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity
affinity: {}
