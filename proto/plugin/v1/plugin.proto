// Plugin Architecture V3 - Go Native Build System
// gRPC service for plugin stage execution via HashiCorp go-plugin

syntax = "proto3";

package conduix.plugin.v1;

option go_package = "github.com/conduix/conduix/plugin-sdk/proto";

// StagePlugin is the gRPC service that plugin binaries implement.
// Pipeline Runner calls this service via HashiCorp go-plugin (unix socket).
service StagePlugin {
  // Init initializes the stage with configuration.
  // Called once when the plugin process starts.
  rpc Init(InitRequest) returns (InitResponse);

  // ProcessBatch processes a batch of records.
  // This is the main data processing method, called repeatedly.
  rpc ProcessBatch(ProcessBatchRequest) returns (ProcessBatchResponse);

  // Close gracefully shuts down the stage.
  // Called when the pipeline stops.
  rpc Close(CloseRequest) returns (CloseResponse);
}

// Record represents a single data record in the pipeline.
message Record {
  // JSON-serialized data payload (map[string]any)
  bytes data = 1;

  // Optional metadata key-value pairs
  map<string, string> metadata = 2;
}

// InitRequest contains stage configuration.
message InitRequest {
  // JSON-serialized config from pipeline definition
  bytes config = 1;

  // Stage type identifier
  string stage_type = 2;
}

// InitResponse returns initialization result.
message InitResponse {
  // Empty on success, error message on failure
  string error = 1;
}

// ProcessBatchRequest contains a batch of records to process.
message ProcessBatchRequest {
  repeated Record records = 1;
}

// ProcessBatchResponse contains the processed results.
message ProcessBatchResponse {
  repeated Record records = 1;

  // Number of records filtered out (not included in records)
  int32 filtered_count = 2;

  // Non-fatal error message (processing continues)
  string error = 3;
}

// CloseRequest is empty.
message CloseRequest {}

// CloseResponse returns shutdown result.
message CloseResponse {
  string error = 1;
}
